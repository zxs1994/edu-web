worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
  }

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  client_max_body_size 32m;

  # Gzip 压缩
  gzip on;
  gzip_min_length 1k;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json text/xml application/xml application/xml+rss text/javascript;
  gzip_vary on;

  server {
    listen 8080;
    server_name localhost;

    # 根路径重定向到前端
    location = / {
      return 302 /web/;
    }

    # 前端静态文件（SPA 部署在 /web/ 路径下）
    location /web/ {
      alias /usr/share/nginx/html/;
      try_files $uri $uri/ /web/index.html;
      index index.html;

      # 静态资源缓存
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
      }
    }

    # API 反向代理到后端服务
    location /admin-api/ {
      proxy_pass http://dh-oa-server:38080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 60s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;

      # 文件上传大小限制
      client_max_body_size 32m;
    }

    # 小程序等 App 端 API（微信登录等）
    location /app-api/ {
      proxy_pass http://dh-oa-server:38080;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 60s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      client_max_body_size 32m;
    }

    # WebSocket 代理（即时通讯等功能）
    location /infra/ws {
      proxy_pass http://dh-oa-server:38080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
